# bring-up.py config — copy to bringup-<your-site>.yaml, EDIT, then:
#   bring-up.py --config bringup-<your-site>.yaml --dry-run   # preflight + plan
#   bring-up.py --config bringup-<your-site>.yaml             # the whole chain
#
# Keys = bring-up.py option names with underscores (name = --name,
# host_num = --host-num). Anything here can still be overridden on the
# command line; anything omitted uses the built-in default shown after
# "default:". Related options live under a group (vm:, redeploy:, ngc:).
# Unknown keys are an error, so a typo cannot silently fall back to a default.
# Every key works on Mac (UTM) and Linux (libvirt/KVM) unless marked.
#
# SEVERAL nico-dev SITES ON ONE HOST: each needs its own config file with a
# distinct name, host_num, site (or dc), underlay and overlay — the four
# things that collide on the host: the VM, its address, the site folder, and
# the routed prefixes. The keys below say "per site" where this applies.

# ── The VM ─────────────────────────────────────────────────────────────
name: nico-vm1                    # VM name (required). UTM VM name on Mac,
                                  #   libvirt domain name on Linux. Also names
                                  #   the disk folder and the VM record.
                                  #   Per site: a second site needs another
                                  #   name (nico-vm2).
user: nico                        # login user created in the VM (default nico)
password: Welcome123!             # that user's password. Normally never asked:
                                  #   the VM builder authorizes ssh_key below and
                                  #   `prep` logs in with it. Fallback for a VM
                                  #   built another way. default Welcome123!
ssh_key: ~/.ssh/id_ed25519.pub    # PUBLIC key authorized in the VM; its private
                                  #   half is what every later ssh uses.
                                  #   default: first ~/.ssh/id_*.pub
# uid: 1000                       # UID of that user inside the VM. Must equal
                                  #   your host UID so files on the share have
                                  #   one owner on both sides. default: your UID
# host_num: 126                   # last octet of the VM address, <subnet>.<host_num>.
                                  #   Per site: two VMs on one host need different
                                  #   values (126, then 125, 124, …). default 126
# subnet: 192.168.64              # LINUX ONLY: first three octets of the NAT
                                  #   network the VM builder creates (nico-nat).
                                  #   The default matches the Mac convention;
                                  #   change it only when 192.168.64.0/24 is
                                  #   already taken on the host. Not a Mac key:
                                  #   UTM owns the subnet there and the address
                                  #   is always <UTM subnet>.<host_num>.
# ip: 192.168.64.126              # MAC ONLY, rarely: the VM address as the Mac
                                  #   reaches it, when UTM's subnet is not
                                  #   192.168.64 (the runner assumes that one).
# ip_explicit: 192.168.64.126     # MAC ONLY, rarely: like ip, and also handed
                                  #   to the VM builder as the static address.
# share: /Users/you/projects      # host folder the VM mounts at /home/<user>/mac.
                                  #   default: the folder that contains the repo
                                  #   worktree the tools are grafted into (the
                                  #   how-to's shared/), so it rarely needs setting.
# share_name: share               # virtiofs mount tag (Linux) / share name (Mac).
                                  #   The VM builder tags it "share"; leave it.

# ── VM sizing (defaults shown; override per machine) ───────────────────
# Two tiers (both are CEILINGS — vCPUs and RAM are not reserved on the host):
#   build-and-play  (deploy from NGC, use the site, no redeploys):
#                    cpus: 6   mem_mb: 8192   — the running stack uses ~5G
#   code development (source builds + redeploy cycles):
#                    cpus: 8+  mem_mb: 16384+ — a full site commits ~90% of a
#                    6-CPU node's CPU requests; a rolling redeploy needs room
#                    for the surge pod or it sticks (issues.md 20260903-#2)
# The host must hold the VM plus ~8 GB for a source build plus its own OS:
#   16 GB / 4 cores  → NGC lane only,      cpus: 4  mem_mb: 8192
#   32 GB / 8+ cores → NGC or source build, cpus: 6  mem_mb: 12288  (recommended)
# (how-to-linux.md Assumptions has the table and the two host rules: Ubuntu Server, no
# suspend.)
# vm:
#   cpus: 6                       # vCPUs (default 6)
#   mem_mb: 12288                 # RAM in MB (default 12288)
#   disk_gb: 120                  # disk, sparse — grows with use, ~25G after
#                                 #   an NGC bring-up, more with source builds
#                                 #   (default 120)

# ── Redeploy policy (recorded in the site yaml; redeploy-dev-nico.py reads it) ─
# When a rolling redeploy cannot schedule its surge pod ("Insufficient cpu" —
# a fully deployed site on a 6-CPU node, issues.md 20260903-#2):
#   wait      = report the cause + the manual unstick, keep waiting (default)
#   scale-down-first = roll that deployment with maxSurge 0 / maxUnavailable 1
#               for this rollout (old pod out first, new one fits), then
#               restore the chart's strategy
# Fires only on that symptom, so it changes nothing on a cluster with room.
# redeploy:
#   on_insufficient_cpu: scale-down-first   # wait | scale-down-first (default wait)

# ── DPF (DOCA Platform Framework) — the default DPU-provisioning path ───
# true (default): NICo runs with DPF enabled and the DPF simulator
# (dev/k8s/dpf-sim-controller) is deployed at the end of bring-up, so MAT
# hosts are provisioned the way production does it. false: the legacy iPXE
# path, nothing DPF-related installed. Tuning (namespace, phase dwell,
# resources) is advanced and lives in the site yaml under nico-system.dpf.
# dpf: true

# ── Firmware upgrade simulation ─────────────────────────────────────────
# A site-level scenario switch: it changes nico-api's configuration and MAT's
# together, which is why it lives here and not in MAT's toml alone.
# false (default): nico-api gets no firmware definition and
# firmware_global.autoupdate stays false, so it never upgrades anything; MAT
# hosts report the mock's hardware-default versions. This is the standard MAT
# flow.
# true: an init container gives nico-api a firmware definition for the mock
# GB200 (vendor Nvidia, model "GB200 NVL") requiring the `desired` BMC and
# UEFI versions and switches firmware_global.autoupdate on; MAT hosts report
# the `initial` versions. Every host is then upgraded during ingestion:
# SimpleUpdate → Redfish task → reset → version recheck. The versions live in
# the site yaml under nico-system.firmware_sim (initial 1.0, desired 2.0 by
# default); vendor, model and inventory ids are fixed to the mock (see
# generate_dev_values.py firmware_sim_init_container). Both lanes.
# firmware_sim: false
#
# How nico-api gets that definition when firmware_sim is true. legacy
# (default): the init container above. api: nothing is written, the site
# starts without a definition like a real one, and you load it after
# bring-up through the REST API with helm-prereqs/load-host-firmware-config.py
# via run-nicocli.sh (how-to, Step 11). Linux lane.
# firmware_sim_delivery: legacy

# ── Extra nico-api site config ──────────────────────────────────────────
# Raw TOML appended verbatim to nico-api's site config
# (carbide-api-site-config.toml) after the sections nico-dev generates, for
# sections it has no key for. Lands in the site yaml as
# nico-system.site_config_extra; unset = nothing appended. Both lanes.
# nico_api_site_config_extra: |
#   [nvlink_config]
#   enabled = true
#   nmx_c_tls_ca_cert_path = "/var/run/secrets/nico-roots/ca.crt"
#   nmx_c_tls_authority = "mat-mock.nvidia.com"

# ── Your site identity — EDIT THESE ────────────────────────────────────
dc: dc1                           # datacenter name: 1-3 chars, lowercase
                                  #   letters/digits, starts with a letter. Lands
                                  #   in bridge names (br-<dc>-internet, 15-char
                                  #   interface limit). default dc1
site: dev1                        # site name: 1-8 chars, lowercase letters/
                                  #   digits, starts with a letter. Lands in the
                                  #   API hostname nico-api.<dc>-<site>, the
                                  #   kubeconfig filename and the site folder
                                  #   sites/<dc>/<site>. default dev
                                  #   Per site: <dc>/<site> must be unique on the
                                  #   host, so a second site is dev2 (or another
                                  #   dc); the same dc for both is fine.
underlay: 11                      # first IP octets — they become host-routed
overlay: 12                       #   prefixes (<underlay>.133.1.0/27 holds the
                                  #   service VIPs, e.g. https://11.133.1.17).
                                  #   Pick octets nothing on your host uses
                                  #   (VPN/LAN!); preflight warns if the host
                                  #   already routes them. defaults 11 and 12
                                  #   Per site: a second site needs its own pair
                                  #   (13 and 14, then 15 and 16, …) — the host
                                  #   routes each site's prefixes to its VM, so
                                  #   two sites on 11/12 would collide.

# ── Where the code is inside the folder specified in share: above ──────
# Both defaults are derived from where these tools sit
# (<share>/<repo>/tools/nico-dev).
# repo: infra-controller          # the nico checkout inside share: that the
                                  #   site is built and deployed from: images,
                                  #   charts, MAT and the CLIs all come from it,
                                  #   on whatever branch it has checked out.
                                  #   Any folder or git worktree inside the
                                  #   share works, so a feature worktree
                                  #   (git worktree add <share>/nico-7023 …)
                                  #   can be the site's checkout: one tree for
                                  #   bring-up and for the feature, no copying
                                  #   between them. Default: the folder these
                                  #   tools are grafted into. An absolute path
                                  #   is accepted when it lies inside the share.
# nico_dev_rel: infra-controller/tools/nico-dev
                                  # the tools folder, relative to share:.
                                  #   default: derived the same way; set it only
                                  #   together with repo.

# To find a deployable NGC tag for ngc.tag below:  ngc-tags.py --config <this file>

# ── Choose ONE deploy mode (setting both is an error) ──────────────────
# NGC pre-built (quickest onboarding — no source build, no Rust).
# The image model: every BASE image — the core and the six REST images — lives
# in ONE NGC registry base under fixed local names (spelled out as images.names
# in your site yaml), with one default tag. Only the core has a different name
# on NGC (nvmetal-carbide) than in the local registry (nico). Optional charts
# (Flow, RMS, …) are deployed after bring-up from their OWN yaml: see
# flow-example.yaml and deploy-flow.py. Nothing about them belongs here.
# ngc:
#   registry: nvcr.io/<org>/<team>     # base — all images live here (required
#                                      #   for this mode)
#   tag: v2.2.0-pr-441-g1234567        # default tag for every image (ngc-tags.py
#                                      #   lists deployable ones); required
#   tags:                              # optional per-group overrides; each
#     core: v2.2.0-pr-440-g89abcde     #   defaults to tag. core = the NICo core
#     rest: v2.2.0-pr-441-g1234567     #   image (the nico release); rest = the
#                                      #   six REST images (nico-rest + site-agent)
#   core_image: nvmetal-carbide        # NGC's name for the core image (default)
#   images:                            # optional: NGC image names, if NGC publishes
#     core: nvmetal-carbide            #   one under a different name. Keys under
#     rest:                            #   rest are the LOCAL names the Helm charts
#       nico-rest-api: nico-rest-api   #   expect (fixed); values are the NGC names.
#                                      #   Unnamed = same name.
#   token_env: NGC_API_KEY             # NAME of the env var holding your NGC key
#                                      #   (default NGC_API_KEY; the value is
#                                      #   never printed or stored)
#   (legacy spelling still accepted: nico_image: <registry>/<core_image>, nico_tag: <tag>)
#
# Source build (the default when ngc: is absent): images are built from the
# worktree on the host and pushed to the local registry. First build 20-40
# minutes on a modern 8-core host, 2-3 hours on a 4-core host of 2012
# vintage; minutes afterwards (the cargo target directory persists in a
# docker cache, one per checkout, so a change recompiles only what it touched).
# tag: main-20260830                # image label; default <branch>-<short sha>
                                  #   of the repo: checkout (-dirty with
                                  #   uncommitted changes), so a new commit is
                                  #   a new tag by itself. Set it to rebuild
                                  #   the same commit under another name. Use a
                                    #   new label for every rebuild: a deployed
                                    #   tag is never rebuilt or redeployed.

# ── Runner behaviour (rarely changed) ──────────────────────────────────
# step_delay: 10                  # settle pause in seconds between steps, so
                                  #   bridges, DHCP and pods get a beat (default
                                  #   10; 0 disables)
# retries: 1                      # retry a failed step command this many times,
                                  #   15 s apart, before stopping (default 1;
                                  #   every step is idempotent)
#
# Not config keys (command line only): --from <step>, --until <step>, --list,
# --dry-run, --config.
