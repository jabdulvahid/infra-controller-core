# bring-up.py config — copy to bringup-<your-site>.yaml, EDIT, then:
#   bring-up.py --config bringup-<your-site>.yaml
# Keys = bring-up.py option names (underscores). Anything here can still be
# overridden on the command line; anything omitted uses the built-in default.

name: nico-vm1                    # UTM VM name (required)
user: nico                        # VM login user
password: Welcome123!             # VM login password
ssh_key: ~/.ssh/id_ed25519.pub    # public key to authorize in the VM
# uid: 1000                       # default: your Mac UID (share ownership match)
# host_num: 126                   # last octet of the VM IP; two VMs can't share one

# ── VM sizing (defaults shown; override per machine) ───────────────────
# Two tiers (both are CEILINGS — vCPUs and RAM are not reserved on the host):
#   build-and-play  (deploy from NGC, use the site, no redeploys):
#                    cpus: 6   mem_mb: 8192   — the running stack uses ~5G
#   code development (source builds + redeploy cycles):
#                    cpus: 8+  mem_mb: 16384+ — a full site commits ~90% of a
#                    6-CPU node's CPU requests; a rolling redeploy needs room
#                    for the surge pod or it sticks (issues.md 20260903-#2)
# vm:
#   cpus: 6
#   mem_mb: 12288
#   disk_gb: 120                  # sparse — grows with use, ~25G after
#                                 #   an NGC bring-up

# ── Redeploy policy (recorded in the site yaml; redeploy-dev-nico.py reads it) ─
# When a rolling redeploy cannot schedule its surge pod ("Insufficient cpu" —
# a fully deployed site on a 6-CPU node, issues.md 20260903-#2):
#   wait      = report the cause + the manual unstick, keep waiting (default)
#   scale-down-first = roll that deployment with maxSurge 0 / maxUnavailable 1
#               for this rollout (old pod out first, new one fits), then
#               restore the chart's strategy
# Fires only on that symptom, so it changes nothing on a cluster with room.
# redeploy:
#   on_insufficient_cpu: scale-down-first

# ── DPF (DOCA Platform Framework) — the default DPU-provisioning path ───
# true (default): NICo runs with DPF enabled and the DPF simulator
# (dev/k8s/dpf-sim-controller) is deployed at the end of bring-up, so MAT
# hosts are provisioned the way production does it. false: the legacy iPXE
# path, nothing DPF-related installed. Tuning (namespace, phase dwell,
# resources) is advanced and lives in the site yaml under nico-system.dpf.
# dpf: true
# ── Firmware upgrade simulation (Linux lane) ───────────────────────────
# false (default): MAT hosts report firmware that already matches, so NICo
# never upgrades anything. true: MAT hosts start below the desired BMC and
# UEFI versions and nico-api gets a firmware definition for the mock GB200,
# so every ingestion runs SimpleUpdate → Redfish task → power cycle →
# version recheck. The versions live in the site yaml under
# nico-system.firmware_sim (initial 1.0, desired 2.0 by default).
# firmware_sim: false

# ── Your site identity — EDIT THESE ────────────────────────────────────
dc: dc1                           # datacenter name (yours to choose)
site: dev1                        # site name (yours to choose)
underlay: 11                      # first IP octets — they become Mac-routed
overlay: 12                       #   prefixes. Pick octets nothing on your
                                  #   Mac uses (VPN/LAN!); bring-up preflight
                                  #   warns if the Mac already routes them.
# To find a deployable NGC tag for ngc.tag below:  ngc-tags.py --config <this file>

# ── Choose ONE deploy mode (setting both is an error) ──────────────────
# NGC pre-built (quickest onboarding — no source build, no Rust).
# The image model: every BASE image — the core and the six REST images — lives
# in ONE NGC registry base under fixed local names (spelled out as images.names
# in your site yaml), with one default tag. Only the core has a different name
# on NGC (nvmetal-carbide) than in the local registry (nico). Optional charts
# (Flow, RMS, …) are deployed after bring-up from their OWN yaml: see
# flow-example.yaml and deploy-flow.py. Nothing about them belongs here.
# ngc:
#   registry: nvcr.io/<org>/<team>     # base — all images live here
#   tag: v2.2.0-pr-441-g1234567        # default tag for every image (ngc-tags.py)
#   tags:                              # optional per-group overrides; each defaults to tag
#     core: v2.2.0-pr-440-g89abcde     #   the NICo core image (the nico release)
#     rest: v2.2.0-pr-441-g1234567     #   the six REST images (nico-rest + site-agent)
#   core_image: nvmetal-carbide        # NGC's name for the core image (default)
#   images:                            # optional: NGC image names, if NGC publishes one
#     core: nvmetal-carbide            #   under a different name. Keys under rest are the
#     rest:                            #   LOCAL names the Helm charts expect (fixed);
#       nico-rest-api: nico-rest-api   #   values are the NGC names. Unnamed = same name.
#   token_env: NGC_API_KEY             # env var NAME holding your NGC key
#   (legacy spelling still accepted: nico_image: <registry>/<core_image>, nico_tag: <tag>)
#
# Source build (the default when ngc: is absent):
# tag: main-20260830                # image label; default main-<today>
