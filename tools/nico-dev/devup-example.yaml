# dev-up.py config — copy to devup-<your-site>.yaml, EDIT, then:
#   dev-up.py --config devup-<your-site>.yaml
# Keys = dev-up.py option names (underscores). Anything here can still be
# overridden on the command line; anything omitted uses the built-in default.

name: nico-vm1                    # UTM VM name (required)
user: nico                        # VM login user
password: Welcome123!             # VM login password
ssh_key: ~/.ssh/id_ed25519.pub    # public key to authorize in the VM
# uid: 1000                       # default: your Mac UID (share ownership match)
# host_num: 126                   # last octet of the VM IP; two VMs can't share one

# ── Your site identity — EDIT THESE ────────────────────────────────────
dc: dc1                           # datacenter name (yours to choose)
site: dev1                        # site name (yours to choose)
underlay: 11                      # first IP octets — they become Mac-routed
overlay: 12                       #   prefixes. Pick octets nothing on your
                                  #   Mac uses (VPN/LAN!); dev-up preflight
                                  #   warns if the Mac already routes them.
# To find a deployable NGC tag for nico_tag below:  ngc-tags.py --config <this file>

# ── Choose ONE deploy mode (setting both is an error) ──────────────────
# NGC pre-built (quickest onboarding — no source build, no Rust):
# ngc:
#   nico_tag: v2.2.0-pr-441-g1234567   # must exist as linux/arm64
#   nico_image: nvcr.io/<org>/<team>/<image>   # or export NICO_NGC_IMAGE
#   token_env: NGC_API_KEY          # env var NAME holding your NGC key
#
# Source build (the default when ngc: is absent):
# tag: main-20260830                # image label; default main-<today>
